<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Healthy | فرع العريش - شمال سيناء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- خط Qatar2022 عبر CDN مع خط احتياطي هندسي مطابق -->
  <link href="https://fonts.cdnfonts.com/css/qatar2022" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- الهيدر العلوي -->
    <header class="top-header" id="topHeader">
      <div class="header-inner">
        <a href="#home" class="brand-logo" data-route="home" aria-label="Healthy">
          <svg class="brand-leaves" viewBox="0 0 44 28" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 25C13 25 5 18 4 6C15 5 23 12 22 25Z" fill="#8CD843"/>
            <path d="M23 25C32 25 39 19 40 9C30 8 23 14 23 25Z" fill="#E3EA3E"/>
          </svg>
          <span class="brand-script">Healthy</span>
        </a>

        <div class="header-actions">
          <button type="button" class="icon-circle-btn" id="openSearchBtn" aria-label="بحث">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
            </svg>
          </button>
          <button type="button" class="icon-circle-btn cart-trigger" data-route="cart" aria-label="السلة">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="9" cy="20" r="1.5"></circle>
              <circle cx="18" cy="20" r="1.5"></circle>
              <path d="M2.5 3.5H5.5L7.6 14.5C7.8 15.4 8.6 16 9.5 16H17.8C18.7 16 19.5 15.4 19.7 14.5L21.2 7.5H6.3"></path>
            </svg>
            <span class="cart-badge hidden" id="headerCartBadge">0</span>
          </button>
        </div>
      </div>

      <!-- شريط البحث المنزلق -->
      <div class="search-drawer" id="searchDrawer">
        <div class="search-input-wrap">
          <svg class="search-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
          <input type="search" id="globalSearchInput" placeholder="ابحث عن حليب، زبادي، جبن، عصائر..." autocomplete="off" />
          <button type="button" class="clear-search-btn hidden" id="clearSearchBtn" aria-label="مسح البحث">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- المحتوى الرئيسي المتغير حسب الصفحة -->
    <main class="main-content" id="appView" aria-live="polite"></main>

    <!-- شريط التنقل السفلي الثابت -->
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button type="button" class="nav-item active" data-route="home">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3L21 10.5V19C21 20.1 20.1 21 19 21H5C3.9 21 3 20.1 3 19V10.5Z"></path>
            <line x1="12" y1="15" x2="12" y2="18"></line>
          </svg>
        </span>
        <span class="nav-label">الرئيسية</span>
      </button>

      <button type="button" class="nav-item" data-route="categories">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="6.5" height="16" rx="1.8"></rect>
            <rect x="13.5" y="4" width="6.5" height="9.5" rx="1.8"></rect>
            <rect x="13.5" y="16" width="6.5" height="4" rx="1.5"></rect>
          </svg>
        </span>
        <span class="nav-label">الأقسام</span>
      </button>

      <button type="button" class="nav-item" data-route="cart">
        <span class="nav-icon nav-cart-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="20" r="1.6"></circle>
            <circle cx="18" cy="20" r="1.6"></circle>
            <path d="M2.5 3.5H5.5L7.6 14.5C7.8 15.4 8.6 16 9.5 16H17.8C18.7 16 19.5 15.4 19.7 14.5L21.2 7.5H6.3"></path>
          </svg>
          <span class="nav-badge hidden" id="navCartBadge">0</span>
        </span>
        <span class="nav-label">السلة</span>
      </button>

      <button type="button" class="nav-item" data-route="more">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <circle cx="6" cy="12" r="1.6"></circle>
            <circle cx="12" cy="12" r="1.6"></circle>
            <circle cx="18" cy="12" r="1.6"></circle>
          </svg>
        </span>
        <span class="nav-label">المزيد</span>
      </button>
    </nav>
  </div>

  <!-- نافذة تفاصيل المنتج -->
  <div class="modal-backdrop hidden" id="productModal">
    <div class="modal-sheet" role="dialog" aria-modal="true">
      <button type="button" class="modal-close-btn" id="closeModalBtn" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <div id="productModalBody"></div>
    </div>
  </div>

  <!-- إشعار منبثق -->
  <div class="toast" id="appToast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
